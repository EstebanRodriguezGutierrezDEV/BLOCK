name: Pruebas

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: todo_tests
          POSTGRES_USER: todo_tests
          POSTGRES_PASSWORD: todo_tests
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U todo_tests -d todo_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TODO_TEST_POSTGRES_URL: postgresql://todo_tests:todo_tests@127.0.0.1:5432/todo_tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip_audit -r requirements.lock --no-deps --disable-pip
      - run: python -m pytest -q
