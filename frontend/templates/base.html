<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#202342" />
    <title>{% block title %}Tu block de tareas{% endblock %}</title>
    {% block metadata %}{% endblock %}
    <link rel="icon" href="{{ url_for('favicon') }}" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icons/block-192.png') }}" />
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    {% if session_view %}
    <meta name="session-view" content="{{ session_view }}" />
    <script src="{{ url_for('static', filename='session-view.js') }}" type="module"></script>
    <script src="{{ url_for('static', filename='notifications.js') }}" type="module"></script>
    {% endif %}
    {% block scripts %}{% endblock %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Saltar al contenido</a>
    {% block content %}{% endblock %}
    {% if session_view %}
    <p id="unread-description" class="sr-only" role="status"></p>
    <dialog id="unread-dialog" class="task-dialog" aria-labelledby="unread-title" aria-describedby="unread-summary" data-login-url="{{ session_sign_in }}">
      <div class="dialog-top">
        <h2 id="unread-title">Mensajes pendientes de leer</h2>
      </div>
      <p id="unread-summary"></p>
      <form method="dialog" class="dialog-actions">
        <button type="submit" class="secondary-button" autofocus>Ahora no</button>
        <a class="primary-button" id="open-unread" href="{{ url_for('messages') }}">Ver mensajes</a>
      </form>
    </dialog>
    {% endif %}
  </body>
</html>
